# RiskFormer Hyperparameter Sweep Configuration
# This file defines the hyperparameters to search over for optimization

# Meta-parameters for the optimization
direction: "minimize"  # Whether to minimize or maximize the objective
optimization_metric: "val_loss"  # The metric to optimize

# Model hyperparameters
# Each parameter defines:
#   type: categorical, float, int, or conditional
#   For float/int: min, max, (optional: log, step)
#   For categorical: values list

# Learning parameters
learning_rate:
  type: "float"
  min: 1.0e-5
  max: 1.0e-3
  log: true  # Use log-scale search

batch_size:
  type: "categorical"
  values: [16, 32, 64, 128]

weight_decay:
  type: "float"
  min: 1.0e-7
  max: 1.0e-4
  log: true

# Optimizer
optimizer:
  type: "categorical"
  values: ["adam", "adamw", "sgd"]

# Model architecture parameters
depth:
  type: "int"
  min: 2
  max: 6

global_depth:
  type: "int"
  min: 1
  max: 4

drop_rate:
  type: "float"
  min: 0.0
  max: 0.5

drop_path_rate:
  type: "float"
  min: 0.0
  max: 0.3

num_heads:
  type: "int"
  min: 4
  max: 16

mlp_ratio:
  type: "float"
  min: 2.0
  max: 6.0

# Transformer-specific parameters
use_attn_mask:
  type: "categorical"
  values: [true, false]

use_class_token:
  type: "categorical"
  values: [true, false]

# Example of a conditional parameter
# Only applies when use_phi is true
downscale_depth:
  type: "conditional"
  condition_on: "use_phi"
  condition_value: true
  param_config:
    type: "int"
    min: 1
    max: 3

# Scheduler settings
scheduler:
  type: "categorical"
  values: ["plateau", "cosine", "step"]

# Training parameters
max_epochs:
  type: "int"
  min: 50
  max: 200
  step: 25

# Example of precision options 
precision:
  type: "categorical"
  values: ["32", "16", "bf16"] 