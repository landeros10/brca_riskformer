# RiskFormer Test Configuration

# Data parameters 
## Mandatory parameters
### Data parameters 
s3_bucket: "tcga-riskformer-data-2025"
s3_prefix: "preprocessed/uni/uni2-h/336"
metadata_file: "/home/ec2-user/brca_riskformer/resources/riskformer_slide_samples.json"
cache_dir: "/tmp/riskformer_cache"

## Optional parameters
### Dataset parameters
max_dim: 16  # Reduced from 32 for faster testing
overlap: 0.1

### DataLoader parameters
num_workers: 2  # Reduced from 4
val_split: 0.2
test_split: 0.1
seed: 42
pin_memory: true

# Model parameters
## Mandatory parameters
### Tasks configuration
tasks:
  odx_train:
    type: regression
    num_classes: 1
    loss_fn: MSELoss
    weight: 1.0
    metrics: [mse, mae]
    activation: tanh

### Model parameters
input_embed_dim: 512  # Reduced from 1024
output_embed_dim: 256  # Reduced from 512
use_phi: true
drop_path_rate: 0.1
drop_rate: 0.1
depth: 2  # Reduced from 4
global_depth: 1  # Reduced from 2
encoding_method: "sinusoidal"
num_heads: 4  # Reduced from 8
use_attn_mask: false
mlp_ratio: 4.0
use_class_token: true
attn_global_hidden_dim: 64  # Reduced from 128

## Optional parameters  
downscale_depth: 1
downscale_stride_q: 2
downscale_stride_k: 2
downscale_multiplier: 1.25

# Training parameters
## Mandatory parameters
### Optimizer parameters
optimizer: "adam"
batch_size: 16  # Reduced from 32
learning_rate: 1.0e-4
weight_decay: 1.0e-6
scheduler: "plateau"
regional_coeff: 0.0
accumulate_grad_batches: 1  # Reduced from 2

## Optional parameters
### Training parameters
max_epochs: 5  # Reduced from 100
min_epochs: 2  # Reduced from 10
patience: 3  # Reduced from 10
precision: "32"
accelerator: "auto"
devices: 1

### Logging parameters
log_dir: "./logs/lightning_logs"
experiment_name: "riskformer_test"
use_wandb: false
wandb_project: "riskformer" 
log_every_nsteps: 5  # Reduced from 10

### Checkpointing parameters
model_dir: "./models"
save_top_k: 2  # Reduced from 3
monitor: "val_loss"
mode: "min" 