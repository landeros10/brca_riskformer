# RiskFormer Training Configuration

# Data parameters 
## Mandatory parameters
### Data parameters 
s3_bucket: "tcga-riskformer-data-2025"
s3_prefix: "preprocessed/uni/uni2-h"
metadata_file: "resources/riskformer_slide_samples.json"
cache_dir: "/tmp/riskformer_cache"

## Optional parameters
### Dataset parameters
max_dim: 32
overlap: 0.1

### DataLoader parameters
num_workers: 4
val_split: 0.2
test_split: 0.1
seed: 42
pin_memory: true

# Model parameters
## Mandatory parameters
### Tasks configuration
tasks:
  odx_train:
    type: regression
    num_classes: 1
    loss_fn: MSELoss
    weight: 1.0
    metrics: [mse, mae]
    activation: tanh
  
  odx85:
    type: binary
    num_classes: 1
    loss_fn: BCEWithLogitsLoss
    weight: 1.0
    metrics: [auroc, accuracy]
    activation: null
    
  mphr:
    type: binary
    num_classes: 1
    loss_fn: BCEWithLogitsLoss
    weight: 1.0
    metrics: [auroc, accuracy]
    activation: null

### Model parameters
input_embed_dim: 1024
output_embed_dim: 512
use_phi: true
drop_path_rate: 0.1
drop_rate: 0.1
depth: 4
global_depth: 2
encoding_method: "sinusoidal"
num_heads: 8
use_attn_mask: false
mlp_ratio: 4.0
use_class_token: true
attn_global_hidden_dim: 128

## Optional parameters  
downscale_depth: 1
downscale_stride_q: 2
downscale_stride_k: 2
downscale_multiplier: 1.25

# Training parameters
## Mandatory parameters
### Optimizer parameters
optimizer: "adam"
batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-6
scheduler: "plateau"
regional_coeff: 0.0
accumulate_grad_batches: 2

## Optional parameters
### Training parameters
max_epochs: 100
min_epochs: 10
patience: 10
precision: "32"
accelerator: "auto"
devices: 1

### Logging parameters
log_dir: "./logs/lightning_logs"
experiment_name: "riskformer"
use_wandb: false
wandb_project: "riskformer" 
log_every_nsteps: 10

### Checkpointing parameters
model_dir: "./models"
save_top_k: 3
monitor: "val_loss"
mode: "min"
